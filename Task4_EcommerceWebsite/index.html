<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Store | CodSoft Task 4</title>
    <meta name="description" content="Shop the latest in premium fashion, electronics and lifestyle at Nova Store.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ── NAVBAR ─────────────────────── -->
    <nav class="navbar">
        <div class="nav-brand">✦ NOVA</div>
        <div class="nav-links">
            <a href="#" class="nav-link">New In</a>
            <a href="#" class="nav-link">Trending</a>
            <a href="#" class="nav-link">Sale</a>
        </div>
        <div class="nav-actions">
            <button class="icon-btn" onclick="toggleSearch()">🔍</button>
            <button class="icon-btn" id="cart-btn" onclick="toggleCart()">
                🛒 <span class="cart-badge" id="cart-count">0</span>
            </button>
        </div>
    </nav>

    <!-- ── SEARCH OVERLAY ─────────────── -->
    <div class="search-overlay" id="search-overlay">
        <input type="text" id="search-input" placeholder="Search products..." oninput="searchProducts()" autofocus>
        <button onclick="toggleSearch()">✕</button>
    </div>

    <!-- ── HERO ───────────────────────── -->
    <section class="hero">
        <div class="hero-content">
            <p class="hero-badge">New Collection 2026</p>
            <h1>Redefine <span>Your Style</span></h1>
            <p class="hero-sub">Curated products for the modern generation. Crafted with precision, delivered with care.
            </p>
            <div class="hero-ctas">
                <button class="btn-primary" onclick="scrollToProducts()">Shop Now →</button>
                <button class="btn-ghost">View Lookbook</button>
            </div>
        </div>
        <div class="hero-graphic">
            <div class="ring ring-lg"></div>
            <div class="ring ring-md"></div>
            <div class="ring ring-sm"></div>
            <span class="hero-emoji">🛍️</span>
        </div>
    </section>

    <!-- ── STATS STRIP ─────────────────── -->
    <div class="stats-strip">
        <div class="stat"><span>12K+</span>
            <p>Happy Customers</p>
        </div>
        <div class="stat"><span>500+</span>
            <p>Premium Products</p>
        </div>
        <div class="stat"><span>4.9★</span>
            <p>Average Rating</p>
        </div>
        <div class="stat"><span>Free</span>
            <p>Shipping Over $50</p>
        </div>
    </div>

    <!-- ── PRODUCTS ────────────────────── -->
    <section class="products-section" id="products-section">
        <div class="section-header">
            <h2>Featured Products</h2>
            <div class="category-filters">
                <button class="filter-btn active" data-cat="all" onclick="filterCat(this,'all')">All</button>
                <button class="filter-btn" data-cat="tech" onclick="filterCat(this,'tech')">Tech</button>
                <button class="filter-btn" data-cat="fashion" onclick="filterCat(this,'fashion')">Fashion</button>
                <button class="filter-btn" data-cat="lifestyle" onclick="filterCat(this,'lifestyle')">Lifestyle</button>
            </div>
        </div>
        <div class="product-grid" id="product-grid"></div>
    </section>

    <!-- ── CART DRAWER ─────────────────── -->
    <div class="cart-backdrop" id="cart-backdrop" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button onclick="toggleCart()">✕</button>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer" id="cart-footer">
            <div class="cart-total">Total: <span id="cart-total">$0</span></div>
            <button class="btn-primary" style="width:100%">Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
